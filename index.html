            const [checkoutModal, setCheckoutModal] = useState(null);
            const [returnModal, setReturnModal] = useState(null);
            const [historyModal, setHistoryModal] = useState(null);

            // 🔄 Firebase 실시간 동기화
            useEffect(() => {
                const checkoutRef = db.ref('checkouts');
                checkoutRef.on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        const list = Object.keys(data).map(key => ({ id: key, ...data[key] }));
                        setCheckouts(list.reverse());
                    } else {
                        setCheckouts([]);
                    }
                });
                return () => checkoutRef.off();
            }, []);

            const categories = useMemo(() => ['All', ...new Set(ITEMS.map(i => i.category))], []);
            const getRemainingQty = (itemId) => {
                const item = ITEMS.find(i => i.id === itemId);
                const activeQty = checkouts.filter(c => c.itemId === itemId && !c.returned).reduce((sum, c) => sum + Number(c.checkout_qty), 0);
                return item.total_qty - activeQty;
            };

            const filteredItems = useMemo(() => {
                let res = ITEMS.filter(i => i.item_name.toLowerCase().includes(searchTerm.toLowerCase()) && (selectedCategory === 'All' || i.category === selectedCategory) && (selectedLocation === 'All' || i.location_code === selectedLocation));
                if (sortOrder) res.sort((a,b) => sortOrder === 'asc' ? getRemainingQty(a.id) - getRemainingQty(b.id) : getRemainingQty(b.id) - getRemainingQty(a.id));
                return res;
            }, [searchTerm, selectedCategory, selectedLocation, sortOrder, checkouts]);

            const handleCheckout = (itemId, borrower, qty) => {
                db.ref('checkouts').push({ itemId, borrower_name: borrower, checkout_qty: qty, checkout_date: new Date().toLocaleString('ko-KR'), returned: false });
                setCheckoutModal(null);
            };

            const handleReturn = (recordId) => {
                db.ref(`checkouts/${recordId}`).update({ returned: true, returned_date: new Date().toLocaleString('ko-KR') });
            };

            return (
                <div className="min-h-screen bg-[#0F0F11] text-white font-sans">
                    <header className="border-b border-white/5 bg-[#16161A] sticky top-0 z-30 h-20 flex items-center">
                        <div className="max-w-7xl mx-auto px-6 w-full flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 rounded-xl bg-[#11E6D8]/10 flex items-center justify-center border border-[#11E6D8]/20 text-[#11E6D8]"><Icons.Package /></div>
                                <h1 className="text-xl font-bold tracking-tight">대학내일 마케팅커뮤니케이션7팀 <span className="text-[#11E6D8]">물자 관리 시스템</span></h1>
                            </div>
                            <button onClick={() => confirm('모든 데이터를 삭제하시겠습니까?') && db.ref('checkouts').remove()} className="text-xs text-white/40 hover:text-red-400 flex items-center gap-1.5 px-3 py-1.5 rounded-lg hover:bg-red-400/10"><Icons.Trash2 /> 시스템 초기화</button>
                        </div>
                    </header>
                    <main className="max-w-7xl mx-auto px-6 py-8">
                        <section className="bg-[#16161A] rounded-2xl border border-white/5 p-6 mb-8 shadow-2xl grid grid-cols-1 md:grid-cols-4 gap-6">
                            <div className="space-y-2"><label className="text-[10px] uppercase tracking-widest text-white/40 font-bold">물품명 검색</label><div className="relative"><div className="absolute left-3 top-1/2 -translate-y-1/2 text-white/20"><Icons.Search /></div><input placeholder="물품명을 입력하세요..." value={searchTerm} onChange={e=>setSearchTerm(e.target.value)} className="w-full bg-[#1F1F24] border border-white/5 rounded-xl py-2.5 pl-10 pr-4 focus:outline-none focus:border-[#11E6D8]/50 transition-all"/></div></div>
                            <div className="space-y-2"><label className="text-[10px] uppercase tracking-widest text-white/40 font-bold">카테고리</label><select value={selectedCategory} onChange={e=>setSelectedCategory(e.target.value)} className="w-full bg-[#1F1F24] border border-white/5 rounded-xl py-2.5 px-4 focus:outline-none focus:border-[#11E6D8]/50 transition-all appearance-none cursor-pointer">{categories.map(c => <option key={c} value={c}>{c === 'All' ? '전체 카테고리' : c}</option>)}</select></div>
                            <div className="space-y-2"><label className="text-[10px] uppercase tracking-widest text-white/40 font-bold">보관 위치</label><select value={selectedLocation} onChange={e=>setSelectedLocation(e.target.value)} className="w-full bg-[#1F1F24] border border-white/5 rounded-xl py-2.5 px-4 focus:outline-none focus:border-[#11E6D8]/50 transition-all appearance-none cursor-pointer"><option value="All">전체 위치</option>{LOCATIONS.map(l => <option key={l.code} value={l.code}>{l.code}</option>)}</select></div>
                            <div className="space-y-2"><label className="text-[10px] uppercase tracking-widest text-white/40 font-bold">잔여 수량 정렬</label><button onClick={() => setSortOrder(sortOrder === 'asc' ? 'desc' : 'asc')} className="w-full bg-[#1F1F24] border border-white/5 rounded-xl py-2.5 px-4 flex items-center justify-between hover:bg-[#25252B] transition-all"><span className="text-sm">{sortOrder === 'asc' ? '적은 순' : sortOrder === 'desc' ? '많은 순' : '기본 정렬'}</span>{sortOrder === 'asc' ? <Icons.ChevronUp /> : <Icons.ChevronDown />}</button></div>
                        </section>
                        <div className="bg-[#16161A] rounded-2xl border border-white/5 overflow-hidden shadow-2xl overflow-x-auto">
                            <table className="w-full text-left border-collapse">
                                <thead className="bg-[#1F1F24]/50 border-bottom border-white/5">
                                    <tr><th className="px-6 py-4 text-[11px] font-bold uppercase tracking-wider text-white/30">물품명</th><th className="px-6 py-4 text-[11px] font-bold uppercase tracking-wider text-white/30">카테고리</th><th className="px-6 py-4 text-[11px] font-bold uppercase tracking-wider text-white/30 text-center">총 수량</th><th className="px-6 py-4 text-[11px] font-bold uppercase tracking-wider text-white/30 text-center">잔여 수량</th><th className="px-6 py-4 text-[11px] font-bold uppercase tracking-wider text-white/30">보관 위치</th><th className="px-6 py-4 text-[11px] font-bold uppercase tracking-wider text-white/30">상태</th><th className="px-6 py-4 text-[11px] font-bold uppercase tracking-wider text-white/30">작업</th></tr>
                                </thead>
                                <tbody className="divide-y divide-white/5">
                                    {filteredItems.map(item => {
                                        const rem = getRemainingQty(item.id);
                                        const active = checkouts.filter(c => c.itemId === item.id && !c.returned);
                                        return (
                                            <tr key={item.id} className="hover:bg-white/[0.02] transition-colors group">
                                                <td className="px-6 py-5"><div className="flex flex-col"><span className="font-semibold text-white/90">{item.item_name}</span><span className="text-xs text-white/30 mt-0.5">{item.note}</span></div></td>
                                                <td className="px-6 py-5"><span className="text-xs px-2 py-1 rounded-md bg-white/5 text-white/60">{item.category}</span></td>
                                                <td className="px-6 py-5 text-center font-mono text-white/40">{item.total_qty}</td>
                                                <td className="px-6 py-5 text-center"><span className={`font-mono font-bold ${rem === 0 ? 'text-red-400' : 'text-[#11E6D8]'}`}>{rem}</span></td>
                                                <td className="px-6 py-5 text-xs text-white/60">{item.location_code}</td>
                                                <td className="px-6 py-5"><span className={`text-[10px] font-bold px-2 py-0.5 rounded-full border ${item.status === '양호' ? 'bg-[#11E6D8]/10 text-[#11E6D8] border-[#11E6D8]/20' : 'bg-orange-500/10 text-orange-500 border-orange-500/20'}`}>{item.status}</span></td>
                                                <td className="px-6 py-5 flex gap-2">
                                                    <button onClick={()=>setCheckoutModal(item)} disabled={rem===0} className="p-2 rounded-lg bg-[#11E6D8]/10 text-[#11E6D8] hover:bg-[#11E6D8] hover:text-black transition-all disabled:opacity-20"><Icons.ArrowUpRight /></button>
                                                    <button onClick={()=>setReturnModal(item)} disabled={active.length===0} className="p-2 rounded-lg bg-white/5 text-white/60 hover:bg-white/10 hover:text-white transition-all disabled:opacity-20"><Icons.ArrowDownLeft /></button>
                                                    <button onClick={()=>setHistoryModal(item)} className="p-2 rounded-lg bg-white/5 text-white/60 hover:bg-white/10 hover:text-white transition-all"><Icons.History /></button>
                                                </td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                    </main>
                    {checkoutModal && (
                        <Modal title="물품 반출 신청" onClose={()=>setCheckoutModal(null)}>
                            <div className="space-y-6">
                                <div className="p-4 rounded-xl bg-white/5 border border-white/5"><p className="text-xs text-white/40 uppercase tracking-wider font-bold mb-1">선택 물품</p><p className="font-bold text-lg">{checkoutModal.item_name}</p></div>
                                <div className="space-y-4">
                                    <div className="space-y-2"><label className="text-xs text-white/40 font-bold">반출 인원 (성함)</label><input id="borrower" autoFocus placeholder="이름을 입력하세요" className="w-full bg-[#1F1F24] border border-white/5 rounded-xl py-3 px-4 outline-none focus:border-[#11E6D8]/50"/></div>
                                    <div className="space-y-2"><label className="text-xs text-white/40 font-bold">반출 수량</label><input id="qty" type="number" defaultValue="1" className="w-full bg-[#1F1F24] border border-white/5 rounded-xl py-3 px-4 outline-none text-center font-mono text-2xl font-bold text-[#11E6D8] focus:border-[#11E6D8]/50"/></div>
                                </div>
                                <div className="flex gap-3 pt-4"><button onClick={()=>setCheckoutModal(null)} className="flex-1 py-3 rounded-xl bg-white/5 font-bold hover:bg-white/10">취소</button><button onClick={()=>{
                                    const b = document.getElementById('borrower').value;
                                    const q = parseInt(document.getElementById('qty').value);
                                    const rem = getRemainingQty(checkoutModal.id);
                                    if(!b.trim() || isNaN(q) || q <= 0 || q > rem) return alert('입력값을 확인하세요 (잔여 수량 초과 등)');
                                    handleCheckout(checkoutModal.id, b, q);
                                }} className="flex-1 py-3 rounded-xl bg-[#11E6D8] text-black font-bold hover:brightness-110">반출 확인</button></div>
                            </div>
                        </Modal>
                    )}
                    {returnModal && (
                        <Modal title="물품 반납 처리" onClose={()=>setReturnModal(null)}>
                            <div className="space-y-4">
                                <p className="text-sm text-white/40 mb-4">반납할 반출 내역을 선택해주세요.</p>
                                <div className="max-h-[300px] overflow-y-auto space-y-2 pr-2 custom-scrollbar">
                                    {checkouts.filter(c => c.itemId === returnModal.id && !c.returned).map(record => (
                                        <div key={record.id} className="p-4 rounded-xl bg-white/5 border border-white/5 flex items-center justify-between group hover:border-[#11E6D8]/30 transition-all">
                                            <div><div className="flex items-center gap-2 mb-1"><span className="font-bold text-white/90">{record.borrower_name}</span><span className="text-[10px] px-1.5 py-0.5 rounded bg-[#11E6D8]/10 text-[#11E6D8] font-mono">{record.checkout_qty}개</span></div><p className="text-[10px] text-white/30 font-mono">{record.checkout_date}</p></div>
                                            <button onClick={()=>handleReturn(record.id)} className="px-4 py-2 rounded-lg bg-[#11E6D8]/10 text-[#11E6D8] text-xs font-bold hover:bg-[#11E6D8] hover:text-black">반납 처리</button>
                                        </div>
                                    ))}
                                </div>
                                <button onClick={()=>setReturnModal(null)} className="w-full py-3 rounded-xl bg-white/5 font-bold hover:bg-white/10 mt-4">닫기</button>
                            </div>
                        </Modal>
                    )}
                    {historyModal && (
                        <Modal title={`${historyModal.item_name} 반출 이력`} onClose={()=>setHistoryModal(null)}>
                            <div className="max-h-[400px] overflow-y-auto space-y-3 pr-2 custom-scrollbar">
                                {checkouts.filter(c => c.itemId === historyModal.id).map(record => (
                                    <div key={record.id} className={`p-4 rounded-xl border ${record.returned ? 'bg-white/[0.02] border-white/5' : 'bg-[#11E6D8]/5 border-[#11E6D8]/20'}`}>
                                        <div className="flex justify-between items-start mb-2">
                                            <div><div className="flex items-center gap-2"><span className="font-bold text-white/90">{record.borrower_name}</span><span className="text-xs text-white/40">({record.checkout_qty}개)</span></div><p className="text-[10px] text-white/30 font-mono mt-0.5">반출: {record.checkout_date}</p></div>
                                            <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${record.returned ? 'bg-white/5 text-white/30' : 'bg-[#11E6D8]/20 text-[#11E6D8]'}`}>{record.returned ? '반납완료' : '반출중'}</span>
                                        </div>
                                        {record.returned && (
                                            <div className="pt-2 border-t border-white/5 flex items-center gap-2">
                                                <div className="text-white/20"><Icons.RotateCcw /></div>
                                                <span className="text-[10px] text-white/30 font-mono">반납: {record.returned_date}</span>
                                            </div>
                                        )}
                                    </div>
                                ))}
                                {checkouts.filter(c => c.itemId === historyModal.id).length === 0 && <p className="py-12 text-center text-white/20">이력이 없습니다.</p>}
                            </div>
                            <button onClick={()=>setHistoryModal(null)} className="w-full py-3 rounded-xl bg-white/5 font-bold hover:bg-white/10 mt-4">닫기</button>
                        </Modal>
                    )}
                </div>
            );
        }

        function Modal({ children, onClose, title }) {
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-6">
                    <div onClick={onClose} className="absolute inset-0 bg-black/80 backdrop-blur-sm"></div>
                    <div className="relative w-full max-w-lg bg-[#16161A] border border-white/10 rounded-2xl shadow-2xl overflow-hidden">
                        <div className="px-6 py-4 border-b border-white/5 flex items-center justify-between bg-[#1F1F24]/50"><h3 className="font-bold text-white/90">{title}</h3><button onClick={onClose} className="text-white/20 hover:text-white"><Icons.X /></button></div>
                        <div className="p-6">{children}</div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
