<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MC7 물자 관리 시스템 (실시간 공유)</title>
  <link rel="icon" href="data:," />

  <!-- 필수 라이브러리 -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #0F0F11; color: white; margin: 0; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Firebase 설정
    const firebaseConfig = {
      apiKey: "AIzaSyDW6_zk1eTTBHQuz1No521BGmX7jjTD0S0",
      authDomain: "mc7-storage.firebaseapp.com",
      databaseURL: "https://mc7-storage-default-rtdb.firebaseio.com",
      projectId: "mc7-storage",
      storageBucket: "mc7-storage.firebasestorage.app",
      messagingSenderId: "989969616746",
      appId: "1:989969616746:web:293af1f90460d16f0b9f13"
    };

    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.database();

    // 아이콘
    const Icons = {
      Package: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>,
      Search: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>,
      Trash2: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>,
      X: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>,
      ChevronUp: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m18 15-6-6-6 6"/></svg>,
      ChevronDown: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m6 9 6 6 6-6"/></svg>,
      History: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>,
      ArrowUpRight: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg>,
      ArrowDownLeft: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 17H7V7"/><path d="M17 7 7 17"/></svg>,
      Plus: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>,
      Edit: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>,
      Alert: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M10.3 3.2h3.4L22 20H2Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>,
    };

    // ✅ 초기 시드 데이터(최초 1회만 DB에 주입됨)
    const SEED_ITEMS = [
      { category: '행사 물자', item_name: '서큘레이터', total_qty: 6, location_code: 'B5F-A-1', status: '양호', note: '' },
      { category: '행사 물자', item_name: 'POP 스탠드 받침', total_qty: 2, location_code: 'B5F-A-1', status: '부품 분실', note: '' },
      { category: '프로젝트 물자', item_name: 'Y굿즈 러그', total_qty: 1, location_code: 'B5F-A-1', status: '양호', note: '' },
      { category: '행사 물자', item_name: '짐벌', total_qty: 2, location_code: 'B5F-A-2', status: '양호', note: '' },
      { category: '행사 물자', item_name: '삼각대', total_qty: 2, location_code: 'B5F-A-2', status: '양호', note: '' },
      { category: '기타 물자', item_name: '마이크', total_qty: 1, location_code: 'B5F-A-2', status: '부품 분실', note: '' },
      { category: '문구류', item_name: '가위', total_qty: 6, location_code: 'B5F-A-3', status: '양호', note: '' },
      { category: '행사 물자', item_name: '구급함', total_qty: 1, location_code: 'B5F-B-1', status: '유통기한 확인 필요', note: '' },
      { category: '행사 물자', item_name: '이젤', total_qty: 30, location_code: 'B5F-B-2', status: '사용 시 받침 등 확인 필요', note: '' },
      { category: '행사 물자', item_name: '끌차', total_qty: 2, location_code: '4F-SEAT', status: '양호', note: '' },
    ];

    function App() {
      const [items, setItems] = useState([]);
      const [checkouts, setCheckouts] = useState([]);

      const [searchTerm, setSearchTerm] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('All');
      const [selectedLocation, setSelectedLocation] = useState('All');
      const [sortOrder, setSortOrder] = useState(null);

      const [checkoutModal, setCheckoutModal] = useState(null);
      const [returnModal, setReturnModal] = useState(null);
      const [historyModal, setHistoryModal] = useState(null);

      const [itemEditModal, setItemEditModal] = useState(null); // { mode:'add'|'edit', item? }

      // ✅ 물자(items) 실시간 동기화 + 최초 1회 시드 주입
      useEffect(() => {
        const itemsRef = db.ref('items');

        itemsRef.once('value').then((snap) => {
          if (!snap.exists()) {
            const updates = {};
            SEED_ITEMS.forEach((it) => {
              const key = itemsRef.push().key;
              updates[key] = it;
            });
            itemsRef.update(updates);
          }
        });

        itemsRef.on('value', (snapshot) => {
          const data = snapshot.val();
          if (data) {
            const list = Object.keys(data).map(key => ({ id: key, ...data[key] }));
            // 이름 기준 정렬(보기 좋게)
            list.sort((a,b) => (a.item_name || '').localeCompare((b.item_name || ''), 'ko'));
            setItems(list);
          } else {
            setItems([]);
          }
        });

        return () => itemsRef.off();
      }, []);

      // 🔄 반출(checkouts) 실시간 동기화
      useEffect(() => {
        const checkoutRef = db.ref('checkouts');
        checkoutRef.on('value', (snapshot) => {
          const data = snapshot.val();
          if (data) {
            const list = Object.keys(data).map(key => ({ id: key, ...data[key] }));
            setCheckouts(list.reverse());
          } else {
            setCheckouts([]);
          }
        });
        return () => checkoutRef.off();
      }, []);

      const categories = useMemo(() => ['All', ...new Set(items.map(i => i.category).filter(Boolean))], [items]);

      const locationCodes = useMemo(
        () => ['All', ...Array.from(new Set(items.map(i => i.location_code).filter(Boolean)))],
        [items]
      );

      const getItemById = (itemId) => items.find(i => i.id === itemId);

      const getRemainingQty = (itemId) => {
        const item = getItemById(itemId);
        if (!item) return 0;
        const activeQty = checkouts
          .filter(c => c.itemId === itemId && !c.returned)
          .reduce((sum, c) => sum + Number(c.checkout_qty || 0), 0);
        return Number(item.total_qty || 0) - activeQty;
      };

      const filteredItems = useMemo(() => {
        let res = items.filter(i =>
          (i.item_name || '').toLowerCase().includes(searchTerm.toLowerCase()) &&
          (selectedCategory === 'All' || i.category === selectedCategory) &&
          (selectedLocation === 'All' || i.location_code === selectedLocation)
        );

        if (sortOrder) {
          res = [...res].sort((a,b) => sortOrder === 'asc'
            ? getRemainingQty(a.id) - getRemainingQty(b.id)
            : getRemainingQty(b.id) - getRemainingQty(a.id)
          );
        }
        return res;
      }, [items, searchTerm, selectedCategory, selectedLocation, sortOrder, checkouts]);

      const handleCheckout = (itemId, borrower, qty) => {
        db.ref('checkouts').push({
          itemId,
          borrower_name: borrower,
          checkout_qty: qty,
          checkout_date: new Date().toLocaleString('ko-KR'),
          returned: false
        });
        setCheckoutModal(null);
      };

      const handleReturn = (recordId) => {
        db.ref(`checkouts/${recordId}`).update({
          returned: true,
          returned_date: new Date().toLocaleString('ko-KR')
        });
      };

      const saveItem = async (mode, payload) => {
        // payload: { item_name, category, total_qty, location_code, status, note }
        const clean = {
          item_name: (payload.item_name || '').trim(),
          category: (payload.category || '').trim(),
          total_qty: Number(payload.total_qty || 0),
          location_code: (payload.location_code || '').trim(),
          status: (payload.status || '').trim(),
          note: (payload.note || '').trim()
        };

        if (!clean.item_name) return alert('물품명은 필수입니다.');
        if (!clean.category) return alert('카테고리는 필수입니다.');
        if (!clean.location_code) return alert('보관 위치 코드는 필수입니다.');
        if (isNaN(clean.total_qty) || clean.total_qty < 0) return alert('총 수량을 확인해주세요.');

        if (mode === 'add') {
          await db.ref('items').push(clean);
        } else if (mode === 'edit' && payload.id) {
          // ✅ 총수량을 줄일 때: 현재 반출중 수량보다 작아지면 막기
          const activeQty = checkouts
            .filter(c => c.itemId === payload.id && !c.returned)
            .reduce((sum, c) => sum + Number(c.checkout_qty || 0), 0);
          if (clean.total_qty < activeQty) {
            return alert(`현재 반출중 수량(${activeQty}개)보다 총 수량을 작게 설정할 수 없습니다.`);
          }
          await db.ref(`items/${payload.id}`).update(clean);
        }
        setItemEditModal(null);
      };

      const deleteItem = async (itemId) => {
        const activeQty = checkouts
          .filter(c => c.itemId === itemId && !c.returned)
          .reduce((sum, c) => sum + Number(c.checkout_qty || 0), 0);

        if (activeQty > 0) {
          return alert(`해당 물품은 현재 ${activeQty}개 반출중이라 삭제할 수 없습니다. (반납 후 삭제 가능)`);
        }
        if (!confirm('이 물품을 삭제할까요? (복구 불가)')) return;
        await db.ref(`items/${itemId}`).remove();
      };

      return (
        <div className="min-h-screen bg-[#0F0F11] text-white font-sans">
          <header className="border-b border-white/5 bg-[#16161A] sticky top-0 z-30 h-20 flex items-center">
            <div className="max-w-7xl mx-auto px-6 w-full flex justify-between items-center">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-[#11E6D8]/10 flex items-center justify-center border border-[#11E6D8]/20 text-[#11E6D8]"><Icons.Package /></div>
                <h1 className="text-xl font-bold tracking-tight">
                  대학내일 마케팅커뮤니케이션7팀 <span className="text-[#11E6D8]">물자 관리 시스템</span>
                </h1>
              </div>

              <div className="flex items-center gap-2">
                <button
                  onClick={() => setItemEditModal({ mode: 'add' })}
                  className="text-xs font-bold bg-[#11E6D8] text-black px-3 py-2 rounded-lg hover:brightness-110 flex items-center gap-1.5"
                  title="물자 추가"
                >
                  <Icons.Plus /> 물자 추가
                </button>

                <button
                  onClick={() => confirm('반출 기록을 모두 삭제할까요?') && db.ref('checkouts').remove()}
                  className="text-xs text-white/40 hover:text-red-400 flex items-center gap-1.5 px-3 py-2 rounded-lg hover:bg-red-400/10"
                  title="반출기록 초기화"
                >
                  <Icons.Trash2 /> 반출기록 초기화
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-6 py-8">
            <section className="bg-[#16161A] rounded-2xl border border-white/5 p-6 mb-8 shadow-2xl grid grid-cols-1 md:grid-cols-4 gap-6">
              <div className="space-y-2">
                <label className="text-[10px] uppercase tracking-widest text-white/40 font-bold">물품명 검색</label>
                <div className="relative">
                  <div className="absolute left-3 top-1/2 -translate-y-1/2 text-white/20"><Icons.Search /></div>
                  <input
                    placeholder="물품명을 입력하세요..."
                    value={searchTerm}
                    onChange={e=>setSearchTerm(e.target.value)}
                    className="w-full bg-[#1F1F24] border border-white/5 rounded-xl py-2.5 pl-10 pr-4 focus:outline-none focus:border-[#11E6D8]/50 transition-all"
                  />
                </div>
              </div>

              <div className="space-y-2">
                <label className="text-[10px] uppercase tracking-widest text-white/40 font-bold">카테고리</label>
                <select
                  value={selectedCategory}
                  onChange={e=>setSelectedCategory(e.target.value)}
                  className="w-full bg-[#1F1F24] border border-white/5 rounded-xl py-2.5 px-4 focus:outline-none focus:border-[#11E6D8]/50 transition-all appearance-none cursor-pointer"
                >
                  {categories.map(c => <option key={c} value={c}>{c === 'All' ? '전체 카테고리' : c}</option>)}
                </select>
              </div>

              <div className="space-y-2">
                <label className="text-[10px] uppercase tracking-widest text-white/40 font-bold">보관 위치</label>
                <select
                  value={selectedLocation}
                  onChange={e=>setSelectedLocation(e.target.value)}
                  className="w-full bg-[#1F1F24] border border-white/5 rounded-xl py-2.5 px-4 focus:outline-none focus:border-[#11E6D8]/50 transition-all appearance-none cursor-pointer"
                >
                  <option value="All">전체 위치</option>
                  {locationCodes.filter(c => c !== 'All').map(code => <option key={code} value={code}>{code}</option>)}
                </select>
              </div>

              <div className="space-y-2">
                <label className="text-[10px] uppercase tracking-widest text-white/40 font-bold">잔여 수량 정렬</label>
                <button
                  onClick={() => setSortOrder(sortOrder === 'asc' ? 'desc' : 'asc')}
                  className="w-full bg-[#1F1F24] border border-white/5 rounded-xl py-2.5 px-4 flex items-center justify-between hover:bg-[#25252B] transition-all"
                >
                  <span className="text-sm">{sortOrder === 'asc' ? '적은 순' : sortOrder === 'desc' ? '많은 순' : '기본 정렬'}</span>
                  {sortOrder === 'asc' ? <Icons.ChevronUp /> : <Icons.ChevronDown />}
                </button>
              </div>
            </section>

            <div className="bg-[#16161A] rounded-2xl border border-white/5 overflow-hidden shadow-2xl overflow-x-auto">
              <table className="w-full text-left border-collapse">
                <thead className="bg-[#1F1F24]/50 border-bottom border-white/5">
                  <tr>
                    <th className="px-6 py-4 text-[11px] font-bold uppercase tracking-wider text-white/30">물품명</th>
                    <th className="px-6 py-4 text-[11px] font-bold uppercase tracking-wider text-white/30">카테고리</th>
                    <th className="px-6 py-4 text-[11px] font-bold uppercase tracking-wider text-white/30 text-center">총 수량</th>
                    <th className="px-6 py-4 text-[11px] font-bold uppercase tracking-wider text-white/30 text-center">잔여 수량</th>
                    <th className="px-6 py-4 text-[11px] font-bold uppercase tracking-wider text-white/30">보관 위치</th>
                    <th className="px-6 py-4 text-[11px] font-bold uppercase tracking-wider text-white/30">상태</th>
                    <th className="px-6 py-4 text-[11px] font-bold uppercase tracking-wider text-white/30">작업</th>
                  </tr>
                </thead>

                <tbody className="divide-y divide-white/5">
                  {filteredItems.map(item => {
                    const rem = getRemainingQty(item.id);
                    const active = checkouts.filter(c => c.itemId === item.id && !c.returned);

                    return (
                      <tr key={item.id} className="hover:bg-white/[0.02] transition-colors group">
                        <td className="px-6 py-5">
                          <div className="flex flex-col">
                            <span className="font-semibold text-white/90">{item.item_name}</span>
                            <span className="text-xs text-white/30 mt-0.5">{item.note}</span>
                          </div>
                        </td>

                        <td className="px-6 py-5">
                          <span className="text-xs px-2 py-1 rounded-md bg-white/5 text-white/60">{item.category}</span>
                        </td>

                        <td className="px-6 py-5 text-center font-mono text-white/40">{item.total_qty}</td>

                        <td className="px-6 py-5 text-center">
                          <span className={`font-mono font-bold ${rem === 0 ? 'text-red-400' : 'text-[#11E6D8]'}`}>{rem}</span>
                        </td>

                        <td className="px-6 py-5 text-xs text-white/60">{item.location_code}</td>

                        <td className="px-6 py-5">
                          <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full border ${item.status === '양호' ? 'bg-[#11E6D8]/10 text-[#11E6D8] border-[#11E6D8]/20' : 'bg-orange-500/10 text-orange-500 border-orange-500/20'}`}>
                            {item.status}
                          </span>
                        </td>

                        <td className="px-6 py-5 flex gap-2">
                          <button
                            onClick={()=>setCheckoutModal(item)}
                            disabled={rem===0}
                            className="p-2 rounded-lg bg-[#11E6D8]/10 text-[#11E6D8] hover:bg-[#11E6D8] hover:text-black transition-all disabled:opacity-20"
                            title="반출"
                          >
                            <Icons.ArrowUpRight />
                          </button>

                          <button
                            onClick={()=>setReturnModal(item)}
                            disabled={active.length===0}
                            className="p-2 rounded-lg bg-white/5 text-white/60 hover:bg-white/10 hover:text-white transition-all disabled:opacity-20"
                            title="반납"
                          >
                            <Icons.ArrowDownLeft />
                          </button>

                          <button
                            onClick={()=>setHistoryModal(item)}
                            className="p-2 rounded-lg bg-white/5 text-white/60 hover:bg-white/10 hover:text-white transition-all"
                            title="이력"
                          >
                            <Icons.History />
                          </button>

                          <button
                            onClick={()=>setItemEditModal({ mode: 'edit', item })}
                            className="p-2 rounded-lg bg-white/5 text-white/60 hover:bg-white/10 hover:text-white transition-all"
                            title="물자 수정"
                          >
                            <Icons.Edit />
                          </button>

                          <button
                            onClick={()=>deleteItem(item.id)}
                            className="p-2 rounded-lg bg-red-500/10 text-red-300 hover:bg-red-500/20 transition-all"
                            title="삭제"
                          >
                            <Icons.Trash2 />
                          </button>
                        </td>
                      </tr>
                    );
                  })}
                  {filteredItems.length === 0 && (
                    <tr>
                      <td colSpan="7" className="px-6 py-16 text-center text-white/25">
                        검색 결과가 없습니다.
                      </td>
                    </tr>
                  )}
                </tbody>
              </table>
            </div>
          </main>

          {/* 반출 모달 */}
          {checkoutModal && (
            <Modal title="물품 반출 신청" onClose={()=>setCheckoutModal(null)}>
              <div className="space-y-6">
                <div className="p-4 rounded-xl bg-white/5 border border-white/5">
                  <p className="text-xs text-white/40 uppercase tracking-wider font-bold mb-1">선택 물품</p>
                  <p className="font-bold text-lg">{checkoutModal.item_name}</p>
                </div>

                <div className="space-y-4">
                  <div className="space-y-2">
                    <label className="text-xs text-white/40 font-bold">반출 인원 (성함)</label>
                    <input id="borrower" autoFocus placeholder="이름을 입력하세요"
                      className="w-full bg-[#1F1F24] border border-white/5 rounded-xl py-3 px-4 outline-none focus:border-[#11E6D8]/50"/>
                  </div>

                  <div className="space-y-2">
                    <label className="text-xs text-white/40 font-bold">반출 수량</label>
                    <input id="qty" type="number" defaultValue="1"
                      className="w-full bg-[#1F1F24] border border-white/5 rounded-xl py-3 px-4 outline-none text-center font-mono text-2xl font-bold text-[#11E6D8] focus:border-[#11E6D8]/50"/>
                  </div>
                </div>

                <div className="flex gap-3 pt-4">
                  <button onClick={()=>setCheckoutModal(null)} className="flex-1 py-3 rounded-xl bg-white/5 font-bold hover:bg-white/10">취소</button>
                  <button onClick={()=>{
                    const b = document.getElementById('borrower').value;
                    const q = parseInt(document.getElementById('qty').value);
                    const rem = getRemainingQty(checkoutModal.id);
                    if(!b.trim() || isNaN(q) || q <= 0 || q > rem) return alert('입력값을 확인하세요 (잔여 수량 초과 등)');
                    handleCheckout(checkoutModal.id, b, q);
                  }} className="flex-1 py-3 rounded-xl bg-[#11E6D8] text-black font-bold hover:brightness-110">반출 확인</button>
                </div>
              </div>
            </Modal>
          )}

          {/* 반납 모달 */}
          {returnModal && (
            <Modal title="물품 반납 처리" onClose={()=>setReturnModal(null)}>
              <div className="space-y-4">
                <p className="text-sm text-white/40 mb-4">반납할 반출 내역을 선택해주세요.</p>
                <div className="max-h-[300px] overflow-y-auto space-y-2 pr-2 custom-scrollbar">
                  {checkouts.filter(c => c.itemId === returnModal.id && !c.returned).map(record => (
                    <div key={record.id} className="p-4 rounded-xl bg-white/5 border border-white/5 flex items-center justify-between group hover:border-[#11E6D8]/30 transition-all">
                      <div>
                        <div className="flex items-center gap-2 mb-1">
                          <span className="font-bold text-white/90">{record.borrower_name}</span>
                          <span className="text-[10px] px-1.5 py-0.5 rounded bg-[#11E6D8]/10 text-[#11E6D8] font-mono">{record.checkout_qty}개</span>
                        </div>
                        <p className="text-[10px] text-white/30 font-mono">{record.checkout_date}</p>
                      </div>
                      <button onClick={()=>handleReturn(record.id)} className="px-4 py-2 rounded-lg bg-[#11E6D8]/10 text-[#11E6D8] text-xs font-bold hover:bg-[#11E6D8] hover:text-black">반납 처리</button>
                    </div>
                  ))}
                </div>
                <button onClick={()=>setReturnModal(null)} className="w-full py-3 rounded-xl bg-white/5 font-bold hover:bg-white/10 mt-4">닫기</button>
              </div>
            </Modal>
          )}

          {/* 이력 모달 */}
          {historyModal && (
            <Modal title={`${historyModal.item_name} 반출 이력`} onClose={()=>setHistoryModal(null)}>
              <div className="max-h-[400px] overflow-y-auto space-y-3 pr-2 custom-scrollbar">
                {checkouts.filter(c => c.itemId === historyModal.id).map(record => (
                  <div key={record.id} className={`p-4 rounded-xl border ${record.returned ? 'bg-white/[0.02] border-white/5' : 'bg-[#11E6D8]/5 border-[#11E6D8]/20'}`}>
                    <div className="flex justify-between items-start mb-2">
                      <div>
                        <div className="flex items-center gap-2">
                          <span className="font-bold text-white/90">{record.borrower_name}</span>
                          <span className="text-xs text-white/40">({record.checkout_qty}개)</span>
                        </div>
                        <p className="text-[10px] text-white/30 font-mono mt-0.5">반출: {record.checkout_date}</p>
                      </div>
                      <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${record.returned ? 'bg-white/5 text-white/30' : 'bg-[#11E6D8]/20 text-[#11E6D8]'}`}>
                        {record.returned ? '반납완료' : '반출중'}
                      </span>
                    </div>
                    {record.returned && (
                      <div className="pt-2 border-t border-white/5">
                        <span className="text-[10px] text-white/30 font-mono">반납: {record.returned_date}</span>
                      </div>
                    )}
                  </div>
                ))}
                {checkouts.filter(c => c.itemId === historyModal.id).length === 0 && (
                  <p className="py-12 text-center text-white/20">이력이 없습니다.</p>
                )}
              </div>
              <button onClick={()=>setHistoryModal(null)} className="w-full py-3 rounded-xl bg-white/5 font-bold hover:bg-white/10 mt-4">닫기</button>
            </Modal>
          )}

          {/* 물자 추가/수정 모달 */}
          {itemEditModal && (
            <ItemEditModal
              onClose={()=>setItemEditModal(null)}
              mode={itemEditModal.mode}
              item={itemEditModal.item}
              onSave={saveItem}
              Icons={Icons}
            />
          )}
        </div>
      );
    }

    function ItemEditModal({ onClose, mode, item, onSave, Icons }) {
      const isEdit = mode === 'edit';
      const [form, setForm] = useState(() => ({
        id: item?.id || '',
        item_name: item?.item_name || '',
        category: item?.category || '',
        total_qty: item?.total_qty ?? 0,
        location_code: item?.location_code || '',
        status: item?.status || '양호',
        note: item?.note || ''
      }));

      return (
        <Modal title={isEdit ? '물자 정보 수정' : '신규 물자 추가'} onClose={onClose}>
          <div className="space-y-4">
            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
              <Field label="물품명" value={form.item_name} onChange={v=>setForm({...form, item_name:v})} placeholder="예) 무선마이크" />
              <Field label="카테고리" value={form.category} onChange={v=>setForm({...form, category:v})} placeholder="예) 행사 물자" />
              <Field label="보관 위치 코드" value={form.location_code} onChange={v=>setForm({...form, location_code:v})} placeholder="예) B5F-A-2" />
              <Field label="상태" value={form.status} onChange={v=>setForm({...form, status:v})} placeholder="예) 양호 / 부품 분실" />
              <FieldNumber label="총 수량" value={form.total_qty} onChange={v=>setForm({...form, total_qty:v})} />
              <Field label="비고" value={form.note} onChange={v=>setForm({...form, note:v})} placeholder="예) 여유분 / 주의사항" />
            </div>

            <div className="flex gap-3 pt-2">
              <button onClick={onClose} className="flex-1 py-3 rounded-xl bg-white/5 font-bold hover:bg-white/10">취소</button>
              <button
                onClick={()=>onSave(mode, form)}
                className="flex-1 py-3 rounded-xl bg-[#11E6D8] text-black font-bold hover:brightness-110 flex items-center justify-center gap-2"
              >
                <Icons.Edit /> 저장
              </button>
            </div>

            <div className="text-[11px] text-white/30 flex items-start gap-2 pt-1">
              <div className="mt-[2px] text-white/25"><Icons.Alert /></div>
              <div>
                <div>총 수량을 줄일 경우, <b className="text-white/60">현재 반출중 수량보다 작게</b> 설정할 수 없도록 막아뒀어요.</div>
              </div>
            </div>
          </div>
        </Modal>
      );
    }

    function Field({ label, value, onChange, placeholder }) {
      return (
        <div className="space-y-2">
          <label className="text-xs text-white/40 font-bold">{label}</label>
          <input
            value={value}
            onChange={e=>onChange(e.target.value)}
            placeholder={placeholder}
            className="w-full bg-[#1F1F24] border border-white/5 rounded-xl py-2.5 px-4 outline-none focus:border-[#11E6D8]/50"
          />
        </div>
      );
    }

    function FieldNumber({ label, value, onChange }) {
      return (
        <div className="space-y-2">
          <label className="text-xs text-white/40 font-bold">{label}</label>
          <input
            type="number"
            value={value}
            onChange={e=>onChange(parseInt(e.target.value || '0', 10))}
            className="w-full bg-[#1F1F24] border border-white/5 rounded-xl py-2.5 px-4 outline-none focus:border-[#11E6D8]/50"
          />
        </div>
      );
    }

    function Modal({ children, onClose, title }) {
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-6">
          <div onClick={onClose} className="absolute inset-0 bg-black/80 backdrop-blur-sm"></div>
          <div className="relative w-full max-w-2xl bg-[#16161A] border border-white/10 rounded-2xl shadow-2xl overflow-hidden">
            <div className="px-6 py-4 border-b border-white/5 flex items-center justify-between bg-[#1F1F24]/50">
              <h3 className="font-bold text-white/90">{title}</h3>
              <button onClick={onClose} className="text-white/20 hover:text-white"><Icons.X /></button>
            </div>
            <div className="p-6">{children}</div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
